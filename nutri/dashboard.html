<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Nutricionista</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/nutri.css">
</head>
<body>
  <div class="container">
    <div class="topo">
      <h1>Clientes</h1>
      <button class="sair" id="btnSair">Sair</button>
    </div>

    <button class="btn" id="btnNovoCliente">+ Novo cliente</button>

    <div class="card" style="margin-top: 16px;">
      <div id="listaClientes">Carregando...</div>
    </div>
  </div>

  <div class="modal escondido" id="modalNovoCliente">
    <div class="modal-conteudo">
      <h2>Novo cliente</h2>
      <form id="formNovoCliente">
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" required>
        </div>
        <div class="campo">
          <label for="dataNascimento">Data de nascimento</label>
          <input type="date" id="dataNascimento">
        </div>
        <div class="campo">
          <label for="telefone">Telefone/WhatsApp</label>
          <input type="tel" id="telefone">
        </div>
        <div class="campo">
          <label for="objetivo">Objetivo</label>
          <input type="text" id="objetivo" placeholder="Ex: emagrecimento">
        </div>
        <button type="submit" class="btn">Criar acesso</button>
        <button type="button" class="btn btn-secundario" id="btnCancelarNovo" style="margin-top: 8px;">Cancelar</button>
        <p id="msgErroNovo" class="erro escondido"></p>
      </form>
    </div>
  </div>

  <div class="modal escondido" id="modalAcesso">
    <div class="modal-conteudo">
      <h2>Acesso criado</h2>
      <p>Envie estes dados para o cliente:</p>
      <p><strong>ID do cliente (interno):</strong></p>
      <div class="codigo-senha" id="idClienteGerado"></div>
      <p><strong>Login / código:</strong></p>
      <div class="codigo-senha" id="codigoGerado"></div>
      <p><strong>Senha:</strong></p>
      <div class="codigo-senha" id="senhaGerada"></div>
      <button class="btn" id="btnCopiar">Copiar código e senha</button>
      <button class="btn btn-secundario" id="btnFecharAcesso" style="margin-top: 8px;">Fechar</button>
    </div>
  </div>

  <script type="module">
    import { observarLogin, logout } from "/shared/auth.js";
    import { listarTodosClientes, alterarStatusCliente, arquivarCliente, cadastrarNovoCliente } from "/shared/db.js";
    import { obterAlertasCliente } from "/shared/cardapio.js";

    observarLogin((user) => {
      if (!user) {
        window.location.href = "/nutri/login.html";
      } else {
        carregarClientes();
      }
    });

    document.getElementById("btnSair").addEventListener("click", async () => {
      await logout();
      window.location.href = "/nutri/login.html";
    });

    function escaparHtml(valor) {
      const mapa = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
      return String(valor).replace(/[&<>"']/g, (caractere) => mapa[caractere]);
    }

    async function carregarClientes() {
      const div = document.getElementById("listaClientes");
      try {
        const clientes = await listarTodosClientes();

        if (clientes.length === 0) {
          div.innerHTML = "<p>Nenhum cliente cadastrado ainda. Use <strong>+ Novo cliente</strong> para começar.</p>";
          return;
        }

        // Renderiza a lista primeiro (rápido), depois busca alertas de
        // cada cliente em paralelo e vai preenchendo os badges.
        div.innerHTML = clientes.map((c) => {
          const status = c.statusAcompanhamento || (c.ativo === false ? "suspenso" : "ativo");
          const statusTexto = status === "excluido" ? "Arquivado" : status === "suspenso" ? "Acompanhamento suspenso" : "Em acompanhamento";
          const acoes = status === "ativo"
            ? `<button type="button" class="btn btn-acao btn-acesso" data-acao="acesso" data-id="${c.id}">ID / login</button>
               <button type="button" class="btn btn-acao btn-suspender" data-acao="suspender" data-id="${c.id}">Suspender</button>
               <button type="button" class="btn btn-acao btn-arquivar" data-acao="arquivar" data-id="${c.id}">Arquivar</button>`
            : status === "suspenso"
              ? `<button type="button" class="btn btn-secundario" data-acao="acesso" data-id="${c.id}" style="width:auto;padding:7px 10px;">Ver ID/login</button>
                 <button type="button" class="btn btn-acao btn-retomar" data-acao="reativar" data-id="${c.id}">Retomar</button>
                 <button type="button" class="btn btn-acao btn-arquivar" data-acao="arquivar" data-id="${c.id}">Arquivar</button>`
              : "";
          return `
            <div class="cliente-linha">
              <div class="cliente-info" data-abrir="${c.id}">
                <div class="cliente-nome">${escaparHtml(c.nome || "Sem nome")}</div>
                <div class="cliente-objetivo">${escaparHtml(c.objetivo || "Sem objetivo definido")}</div>
                <div class="cliente-status status-${status}">${statusTexto}</div>
                <div id="badges-${c.id}">${c.primeiroAcessoConcluido ? "" : '<span class="badge-alerta">Aguardando 1º acesso</span>'}</div>
              </div>
              <div class="cliente-acoes">${acoes}</div>
            </div>
          `;
        }).join("");

        div.querySelectorAll("[data-abrir]").forEach((el) => {
          el.addEventListener("click", () => {
            const cliente = clientes.find((c) => c.id === el.dataset.abrir);
            if (cliente && (cliente.statusAcompanhamento || (cliente.ativo === false ? "suspenso" : "ativo")) !== "excluido") {
              window.location.href = `/nutri/cliente.html?id=${cliente.id}`;
            }
          });
        });

        div.querySelectorAll("[data-acao]").forEach((btn) => {
          btn.addEventListener("click", async (event) => {
            event.stopPropagation();
            const id = btn.dataset.id;
            const cliente = clientes.find((c) => c.id === id);
            if (!cliente) return;
            const acao = btn.dataset.acao;
            if (acao === "acesso") {
              document.getElementById("idClienteGerado").textContent = cliente.id;
              document.getElementById("codigoGerado").textContent = cliente.codigo || "Código não encontrado neste cadastro";
              document.getElementById("senhaGerada").textContent = "Por segurança, a senha não fica salva. Se o cliente perdeu a senha, será necessário configurar uma recuperação segura.";
              document.getElementById("btnCopiar").onclick = () => navigator.clipboard.writeText(`ID: ${cliente.id}\\nLogin/código: ${cliente.codigo || ""}`);
              document.getElementById("modalAcesso").classList.remove("escondido");
              return;
            }
            try {
              btn.disabled = true;
              if (acao === "suspender") {
                if (!confirm(`Suspender o acompanhamento de ${cliente.nome}? O acesso aos dados do AppNutri ficará bloqueado enquanto estiver suspenso.`)) return;
                await alterarStatusCliente(id, "suspenso");
              } else if (acao === "reativar") {
                if (!confirm(`Retomar o acompanhamento de ${cliente.nome}?`)) return;
                await alterarStatusCliente(id, "ativo");
              } else if (acao === "arquivar") {
                if (!confirm(`Arquivar o cadastro de ${cliente.nome}? Ele sairá da lista ativa, mas os registros serão preservados e não serão apagados definitivamente.`)) return;
                await arquivarCliente(id);
              }
              await carregarClientes();
            } catch (err) {
              console.error("Erro ao atualizar cliente:", err);
              alert("Não foi possível atualizar o cadastro. Confira a conexão e tente novamente.");
            } finally {
              btn.disabled = false;
            }
          });
        });

        clientes.forEach(async (c) => {
          if (!c.primeiroAcessoConcluido) return; // sem check-in/cardápio ainda faz sentido
          try {
            const alertas = await obterAlertasCliente(c.id);
            const container = document.getElementById(`badges-${c.id}`);
            if (container && alertas.length > 0) {
              container.innerHTML = alertas
                .map((a) => `<span class="badge-alerta">${a.texto}</span>`)
                .join(" ");
            }
          } catch (err) {
            console.error(`Erro ao buscar alertas de ${c.id}`, err);
          }
        });
      } catch (err) {
        div.innerHTML = "<p class='erro'>Erro ao carregar clientes.</p>";
        console.error(err);
      }
    }

    const modalNovo = document.getElementById("modalNovoCliente");
    const modalAcesso = document.getElementById("modalAcesso");

    document.getElementById("btnNovoCliente").addEventListener("click", () => {
      modalNovo.classList.remove("escondido");
    });

    document.getElementById("btnCancelarNovo").addEventListener("click", () => {
      modalNovo.classList.add("escondido");
    });

    document.getElementById("formNovoCliente").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msgErro = document.getElementById("msgErroNovo");
      msgErro.classList.add("escondido");

      const dados = {
        nome: document.getElementById("nome").value,
        dataNascimento: document.getElementById("dataNascimento").value || null,
        contato: { telefone: document.getElementById("telefone").value || "" },
        objetivo: document.getElementById("objetivo").value || "",
      };

      try {
        const { clienteId, codigo, senha } = await cadastrarNovoCliente(dados);

        modalNovo.classList.add("escondido");
        document.getElementById("formNovoCliente").reset();

        document.getElementById("idClienteGerado").textContent = clienteId;
        document.getElementById("codigoGerado").textContent = codigo;
        document.getElementById("senhaGerada").textContent = senha;
        modalAcesso.classList.remove("escondido");

        document.getElementById("btnCopiar").onclick = () => {
          navigator.clipboard.writeText(`ID: ${clienteId}\nLogin/código: ${codigo}\nSenha temporária: ${senha}`);
        };

        carregarClientes();
      } catch (err) {
        msgErro.textContent = "Erro ao criar cliente. Tente novamente.";
        msgErro.classList.remove("escondido");
        console.error(err);
      }
    });

    document.getElementById("btnFecharAcesso").addEventListener("click", () => {
      modalAcesso.classList.add("escondido");
    });
  </script>
</body>
</html>
