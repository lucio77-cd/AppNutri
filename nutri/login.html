<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Nutricionista</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/nutri.css">
</head>
<body>
  <div class="container">
    <h1>Entrar</h1>
    <div class="card">
      <form id="formLogin">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required>
        </div>
        <button type="submit" class="btn">Entrar</button>
        <p id="msgErro" class="erro escondido"></p>
      </form>
    </div>
  </div>

  <script type="module">
    import { loginNutricionista } from "/shared/auth.js";

    const form = document.getElementById("formLogin");
    const msgErro = document.getElementById("msgErro");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msgErro.classList.add("escondido");

      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;

      try {
        await loginNutricionista(email, senha);
        window.location.href = "/nutri/dashboard.html";
      } catch (err) {
        msgErro.textContent = "E-mail ou senha incorretos.";
        msgErro.classList.remove("escondido");
      }
    });
  </script>
</body>
</html>
